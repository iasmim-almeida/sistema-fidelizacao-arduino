services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itclube_demo
      POSTGRES_USER: itclube_demo
      POSTGRES_PASSWORD: itclube_demo_local
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itclube_demo -d itclube_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
