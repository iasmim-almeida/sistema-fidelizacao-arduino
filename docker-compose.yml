# ==============================================================================
# docker-compose.yml - IT Clube
# Orquestração de serviços para desenvolvimento e ambiente produtivo
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itclube_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
    networks:
      - itclube_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  itclube_network:
    driver: bridge
