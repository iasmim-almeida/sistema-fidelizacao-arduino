# ==============================================================================
# docker-compose.yml - IT Clube
# Orquestração de serviços para desenvolvimento e ambiente produtivo
# ==============================================================================

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itclube_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-itclube_user}:${POSTGRES_PASSWORD:-itclube_secret}@db:5432/${POSTGRES_DB:-itclube_db}
      - FLASK_ENV=${FLASK_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itclube_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: itclube_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itclube_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itclube_secret}
      POSTGRES_DB: ${POSTGRES_DB:-itclube_db}
    volumes:
      - itclube_pgdata:/var/lib/postgresql/data
    networks:
      - itclube_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itclube_user} -d ${POSTGRES_DB:-itclube_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  itclube_network:
    driver: bridge

volumes:
  itclube_pgdata:
    driver: local
