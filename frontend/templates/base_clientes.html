<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FideliZa - {% block titulo %}Painel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="wrapper">
    <nav id="sidebar">
        <div class="sidebar-heading mb-4 px-4">
            <i class="fas fa-sparkles text-warning"></i> FideliZa
        </div>

        <div class="sidebar-section-title">Principal</div>
        <a href="{{ url_for('main.bemvindo') }}" class="nav-link-sidebar {% if active=='bemvindo' %}active{% endif %}"><i class="fas fa-home"></i> Início</a>
        <a href="{{ url_for('main.meuspontos') }}" class="nav-link-sidebar {% if active=='meuspontos' %}active{% endif %}"><i class="fas fa-users"></i> Meus pontos</a>
        <a href="{{ url_for('main.recompensas') }}" class="nav-link-sidebar {% if active=='recompensas' %}active{% endif %}"><i class="fas fa-gift"></i> Recompensas</a>
        <a href="{{ url_for('main.historico') }}" class="nav-link-sidebar {% if active=='historico' %}active{% endif %}"><i class="fas fa-chart-bar"></i> Historico</a>
    </nav>

    <div id="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold m-0">{% block page_title %}{% endblock %}</h4>
                <small class="text-muted">{% block page_subtitle %}{% endblock %}</small>
            </div>
            <div>
                <a href="{{ url_for('main.index') }}" class="btn btn-light btn-sm rounded-circle shadow-sm p-2" title="Sair"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
