<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FideliZa - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    body { background-color: var(--bg-sistema); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { border: 2px solid var(--rosa-pastel); border-radius: 20px; background: #ffffff; box-shadow: 0 10px 25px rgba(92, 58, 67, 0.05); padding: 30px; max-width: 400px; width: 100%; }
    .alert-error { background: #ffe5e5; color: #9b1c1c; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .alert-success { background: #e7f8ed; color: #166534; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .link-cadastro { cursor: pointer; text-decoration: none; font-weight: 600; color: var(--sidebar-color); }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-logo"><i class="bi bi-stars"></i></div>
      <h1 class="brand-name">Fideli<span>Za</span></h1>
      <p class="brand-tagline">Sistema de fidelizacao de clientes</p>
    </div>

    <div id="alertaErro" class="alert-error mb-3 d-none">
      <i class="bi bi-exclamation-circle me-1"></i> E-mail ou senha incorretos.
    </div>
    <div id="alertaSucesso" class="alert-success mb-3 d-none">
      <i class="bi bi-check-circle me-1"></i> Login realizado! Redirecionando...
    </div>

    <!-- LOGIN -->
    <form id="formLogin" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required autocomplete="email" />
      </div>
      <div class="mb-4">
        <label for="senha" class="form-label">Senha</label>
        <div class="input-group">
          <input type="password" class="form-control" id="senha" placeholder="********" required autocomplete="current-password" />
          <span class="input-group-text" id="toggleSenha" style="cursor: pointer;"><i class="bi bi-eye" id="iconeSenha"></i></span>
        </div>
      </div>
      <button type="submit" class="btn btn-login btn-primary w-100 text-white mb-3"><i class="bi bi-box-arrow-in-right me-2"></i>Entrar</button>
    </form>

    <div id="demoArea">
      <div class="divider mb-3 mt-3">acesso de demonstracao</div>
      <div class="badge-demo text-center">
        E-mail: <code>admin@loja.com</code> &nbsp;|&nbsp; Senha: <code>1234</code>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const alertaErro = document.getElementById('alertaErro');
    const alertaSucesso = document.getElementById('alertaSucesso');

    document.getElementById('toggleSenha').addEventListener('click', function () {
      const input = document.getElementById('senha');
      const icone = document.getElementById('iconeSenha');
      if (input.type === 'password') { input.type = 'text'; icone.className = 'bi bi-eye-slash'; }
      else { input.type = 'password'; icone.className = 'bi bi-eye'; }
    });

    // INTEGRACAO REAL: chama POST /auth/login no backend Flask
    document.getElementById('formLogin').addEventListener('submit', async function (event) {
      event.preventDefault();
      alertaErro.classList.add('d-none');
      alertaSucesso.classList.add('d-none');

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      const resp = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email: email, senha: senha })
      });

      if (resp.ok) {
        alertaSucesso.classList.remove('d-none');
        setTimeout(() => { window.location.href = '/dashboard'; }, 600);
      } else {
        const data = await resp.json().catch(() => ({}));
        alertaErro.innerHTML = '<i class="bi bi-exclamation-circle me-1"></i> ' + (data.erro || 'Credenciais invalidas.');
        alertaErro.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
