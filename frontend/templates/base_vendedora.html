<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FideliZa - {% block titulo %}Painel{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="wrapper">
    <nav id="sidebar">
        <div class="text-end px-3 pt-2">
            <button id="btnFecharSidebar" class="btn btn-sm rounded-circle text-white" style="background-color: rgba(255,255,255,0.2); border: none;">
                <i class="fas fa-bars"></i> 
            </button>
        </div>

        <div class="sidebar-heading mb-4 px-4">
            <i class="fas fa-sparkles text-warning"></i> FideliZa
        </div>

        <div class="sidebar-section-title">Principal</div>
        <a href="{{ url_for('main.dashboard') }}" class="nav-link-sidebar {% if active=='dashboard' %}active{% endif %}"><i class="fas fa-home"></i> Início</a>
        <a href="{{ url_for('main.v_clientes') }}" class="nav-link-sidebar {% if active=='clientes' %}active{% endif %}"><i class="fas fa-users"></i> Clientes</a>

        <div class="sidebar-section-title">Programa</div>
        <a href="{{ url_for('main.pontuar') }}" class="nav-link-sidebar {% if active=='pontuar' %}active{% endif %}"><i class="fas fa-coins"></i> Fidelização</a>
        <a href="{{ url_for('main.resgate') }}" class="nav-link-sidebar {% if active=='resgate' %}active{% endif %}"><i class="fas fa-gift"></i> Recompensas</a>
        <a href="{{ url_for('main.relatorios') }}" class="nav-link-sidebar {% if active=='relatorios' %}active{% endif %}"><i class="fas fa-chart-bar"></i> Relatórios</a>
    </nav>

    <div id="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            
            <div class="d-flex align-items-center gap-3">
                <button id="btnAbrirSidebar" class="btn btn-light shadow-sm p-2 rounded-circle d-none" style="color: #d85f82; border: 1px solid #ffccd8;">
                    <i class="fas fa-bars"></i>
                </button>
                <div>
                    <h4 class="fw-bold m-0">{% block page_title %}{% endblock %}</h4>
                    <small class="text-muted">{% block page_subtitle %}{% endblock %}</small>
                </div>
            </div>
            <div>
                <a href="{{ url_for('main.bemvindo') }}" class="btn btn-light btn-sm rounded-circle shadow-sm p-2" title="Area do cliente"><i class="fas fa-home"></i></a>
                <a href="{{ url_for('main.index') }}" class="btn btn-light btn-sm rounded-circle shadow-sm p-2" title="Sair"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </div>

        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    const btnAbrir = document.getElementById('btnAbrirSidebar');
    const btnFechar = document.getElementById('btnFecharSidebar');
    const sidebar = document.getElementById('sidebar');
    const conteudo = document.getElementById('content');

    function alternarMenu() {
        // Altera o estado de visibilidade da barra rosa
        sidebar.classList.toggle('sidebar-escondida');
        conteudo.classList.toggle('content-expandido');
        
        // Controla a exibição do botão de três risquinhos do lado de fora
        btnAbrir.classList.toggle('d-none');
    }

    if (btnAbrir && btnFechar && sidebar && conteudo) {
        btnAbrir.addEventListener('click', alternarMenu);
        btnFechar.addEventListener('click', alternarMenu);
    }
});
</script>
</body>
</html>
