name: CI - IT Clube

on:
  push:
    branches: [ main, master, feat/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Testes Automatizados e Auditoria de Segurança
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: itclube_test
          POSTGRES_USER: itclube
          POSTGRES_PASSWORD: itclube_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itclube -d itclube_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: "ci-secret-key-test-environment"
      INITIAL_SETUP_TOKEN: "ci-initial-setup-token"
      DATABASE_URL: "postgresql://itclube:itclube_ci@localhost:5432/itclube_test"
      FLASK_ENV: development

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Verificar Compilação Python
        run: |
          python -m compileall -q backend/app backend/tests database/migrations run.py wsgi.py test_security_audit.py

      - name: Validar Consistência das Migrations (Alembic)
        run: |
          flask --app run.py db upgrade
          flask --app run.py db check

      - name: Executar Suíte de Testes Unitários e de Integração
        run: |
          python -m unittest discover -s backend/tests -v

      - name: Executar Verificações Funcionais de Controles de Segurança
        run: |
          python test_security_audit.py
